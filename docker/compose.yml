services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    volumes:
      - "../build/libs:/opt/keycloak/providers/"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - "9000:9000"
    command:
      - "start-dev"
      - "--http-port=9000"
      - "--features=token-exchange,admin-fine-grained-authz:v1"
      - "--cache=local"
    healthcheck:
      # The image has no curl; a Host header is required or Keycloak answers 500.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"
      interval: 5s
      timeout: 3s
      retries: 60
